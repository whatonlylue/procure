[project]
name = "procure"
version = "0.2.4"
description = "Local-first RAG: drag-drop ingest, chunk+embed+store, semantic search."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pypdf>=4.0",
  "mcp>=2,<3",
  "platformdirs>=4",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.0", "pymupdf>=1.24", "pillow>=10"]
web = ["trafilatura>=1.0"]
readability = ["readability-lxml>=0.8"]
# Retrieval-benchmark dependencies (source checkouts only: app.bench is
# excluded from built wheels/binaries below, so `pip install procure[bench]`
# only makes sense alongside a git clone, for `bench pull --source beir`;
# the default mteb pull path and the rest of the harness are stdlib-only).
bench = ["pyarrow>=12"]
dev = ["pyinstaller>=6"]
all = ["rapidocr-onnxruntime>=1.0", "pymupdf>=1.24", "pillow>=10", "trafilatura>=1.0", "readability-lxml>=0.8", "pyarrow>=12"]

[project.scripts]
procure = "app.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# app.bench is a source-only dev harness (stdlib-only): it stays in git for
# `git clone` users but is excluded from wheels/sdists so app-only installs
# never ship it. `procure bench` in cli.py degrades to a clear error there.
include = ["app*"]
exclude = ["app.bench", "app.bench.*"]

[tool.setuptools.package-data]
app = ["static/**", "_skill_data/**"]

[tool.ruff]
target-version = "py311"
select = ["F"]
