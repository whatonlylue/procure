[project]
name = "procure"
version = "0.2.3"
description = "Local-first RAG: drag-drop ingest, chunk+embed+store, semantic search."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pypdf>=4.0",
  "mcp>=2,<3",
  "platformdirs>=4",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=3.0"]
chroma = ["chromadb>=0.5"]
ocr = ["rapidocr-onnxruntime>=1.0", "pymupdf>=1.24", "pillow>=10"]
web = ["trafilatura>=1.0"]
readability = ["readability-lxml>=0.8"]
dev = ["pyinstaller>=6"]
all = ["sentence-transformers>=3.0", "chromadb>=0.5", "rapidocr-onnxruntime>=1.0", "pymupdf>=1.24", "pillow>=10", "trafilatura>=1.0", "readability-lxml>=0.8"]

[project.scripts]
procli = "app.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**", "_skill_data/**"]

[tool.ruff]
target-version = "py311"
select = ["F"]
