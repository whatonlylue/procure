# Build desktop bundles for macOS + Windows and attach them to the tag's
# GitHub release. Trigger: git tag vX.Y && git push origin vX.Y
# (see scripts/build_desktop.sh for the equivalent local macOS build).
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-uv installs its own Python (no setup-python needed) and
      # caches wheels + the interpreter between runs.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri shells out to pkg-config for system glib/GTK via tao ->
      # glib-sys on Linux; without these dev packages the glib-sys build
      # script fails and `cargo test` never compiles.
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Backend tests
        run: |
          uv sync --locked
          uv run --no-sync python -m unittest discover -s tests

      - name: Lint (ruff)
        # uvx runs the pinned prebuilt ruff binary from the uv cache,
        # without touching the project venv.
        run: uvx ruff@0.16.10 check app tests

      - name: Frontend typecheck + build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Stage dummy sidecar for cargo test
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/ProcureHelper-${TRIPLE}"
          chmod +x "src-tauri/binaries/ProcureHelper-${TRIPLE}"

      - name: Desktop shell tests
        run: |
          cd src-tauri
          cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-uv installs its own Python (no setup-python needed) and
      # caches wheels + the interpreter between runs.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # The `dev` extra is just pyinstaller; --locked keeps CI on uv.lock.
      - name: Install Python deps + PyInstaller
        run: uv sync --locked --extra dev

      - name: Build sidecar
        run: uv run --no-sync pyinstaller --noconfirm procure-sidecar.spec

      - name: Stage sidecar for Tauri (unix)
        if: runner.os != 'Windows'
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          cp dist/ProcureHelper "src-tauri/binaries/ProcureHelper-${TRIPLE}"

      - name: Stage sidecar for Tauri (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triple = ((rustc -vV | Select-String '^host: ') -replace 'host: ','').Trim()
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item dist/ProcureHelper.exe "src-tauri/binaries/ProcureHelper-$triple.exe"

      # The Tauri CLI ships as the @tauri-apps/cli npm devDependency, so
      # `npm ci` above already installed the runner-correct prebuilt binary
      # (no cargo-binstall, no source compile lottery). It runs from the
      # repo root so it finds src-tauri/tauri.conf.json.
      - name: Build Tauri bundle
        shell: bash
        run: ./frontend/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true

      - name: Attach bundles to release
        uses: softprops/action-gh-release@v3
        with:
          # Artifacts preserve their bundle subdir (bundles/dmg/..., bundles/nsis/...),
          # so match recursively. fail_on_unmatched_files keeps a future
          # path change from silently publishing an empty release.
          files: bundles/**/*
          fail_on_unmatched_files: true
